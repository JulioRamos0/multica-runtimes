name: PR Validation Build

on:
  pull_request:
    branches:
      - main
    paths:
      - '**/Dockerfile'
      - '**/*.sh'
      - 'docker-compose.yml'

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Test Docker Compose Build
        run: docker compose build
